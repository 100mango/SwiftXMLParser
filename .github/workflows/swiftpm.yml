name: SwiftPM

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect package
        run: |
          swift --version
          swift package dump-package
          swift package describe
      - name: Test package in Debug
        run: swift test --jobs 2
      - name: Test package in Release
        run: swift test -c release --jobs 2
      - name: Test independent consumer
        env:
          PACKAGE_VERSION: ${{ github.event.release.tag_name }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: bash scripts/test-consumer.sh
